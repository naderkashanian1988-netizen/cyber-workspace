name: windows-build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Source/Windows/requirements.txt
          pip install "pyinstaller==6.11.1"

      - name: Run engine test suite (TEST A-J)
        working-directory: Source/Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -v

      - name: Build with PyInstaller (app icon embedded via spec)
        run: >
          pyinstaller Build/Configuration/cyber_workspace.spec
          --distpath dist --workpath build --noconfirm --clean

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (output lands in Installer/Windows)
        shell: cmd
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" Build\Configuration\cyber_workspace.iss'

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: CyberWorkspace-portable
          path: dist/CyberWorkspace/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CyberWorkspace-installer
          path: Installer/Windows/CyberWorkspace-*-setup.exe
