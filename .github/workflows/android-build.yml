name: android-build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7 (matches gradle-wrapper.properties)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run unit tests (protocol, tri-timer, pinning)
        working-directory: Source/Android
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build APK (debug)
        working-directory: Source/Android
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: Source/Android/app/build/test-results/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberWorkspace-remote-debug-apk
          path: Source/Android/app/build/outputs/apk/debug/app-debug.apk
